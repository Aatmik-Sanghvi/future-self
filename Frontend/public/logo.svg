<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching the website -->
    <linearGradient id="fsNavGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="45%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Star Golden Gradient -->
    <linearGradient id="fsStarGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffea79" />
      <stop offset="40%" stop-color="#fbc02d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="fsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Rounded Container -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="#7c3aed" opacity="0.45" filter="url(#fsGlow)" />

  <!-- Badge Container with Glass Border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#fsNavGrad)" stroke="#c4b5fd" stroke-width="10" stroke-opacity="0.38" />

  <!-- Main Center-Right Sparkle Star -->
  <!-- Center: (320, 260), Outer R: 160, Inner concavity curves to center -->
  <path d="M 320 100 Q 320 260 480 260 Q 320 260 320 420 Q 320 260 160 260 Q 320 260 320 100 Z" fill="url(#fsStarGold)" />

  <!-- Top-Left Sparkle Star -->
  <!-- Center: (195, 155), Outer R: 60 -->
  <path d="M 195 95 Q 195 155 255 155 Q 195 155 195 215 Q 195 155 135 155 Q 195 155 195 95 Z" fill="url(#fsStarGold)" />

  <!-- Bottom-Left Sparkle Star -->
  <!-- Center: (170, 360), Outer R: 64 -->
  <path d="M 170 296 Q 170 360 234 360 Q 170 360 170 424 Q 170 360 106 360 Q 170 360 170 296 Z" fill="url(#fsStarGold)" />
</svg>
